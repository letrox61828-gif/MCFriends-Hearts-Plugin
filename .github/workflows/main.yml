name: Build McFriends-Hearts-Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Plugin bauen
        run: gradle build --no-daemon

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: McFriends-Hearts-Plugin-JAR
          path: build/libs/*.jar
